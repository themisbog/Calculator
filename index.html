<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <div class="calculator">
    <input type="text" id="display" disabled />
    <div class="buttons-grid">
        <button class="mem-btn">MC</button>
        <button class="mem-btn">MR</button>
        <button class="mem-btn">M-</button>
        <button class="mem-btn">M+</button>
        <button class="ac-btn">AC</button>
        <button class="rootX-btn">√X</button>
        <button class="op-btn">%</button>
        <button class="num-btn">7</button>
        <button class="num-btn">8</button>
        <button class="num-btn">9</button>
        <button class="op-btn">÷</button>
        <button class="op-btn">×</button>
        <button class="op-btn">-</button>
        <button class="op-btn">+</button>
        <button class="op-btn">=</button>
        <button class="dec-btn">.</button>
        <button class="op-btn">π</button>
        <button class="op-btn">xy</button>
        <button class="op-btn">R2</button>
        <button class="op-btn">R0</button>
        <button class="op-btn">+/-</button>
        </div>
</div>

</body>
</html>
